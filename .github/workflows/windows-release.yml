name: AsmrDownloader Windows Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      APP_NAME: "${{ github.event.repository.name }}"
      VERSION: "${{ github.ref_name }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Set pubspec version from tag
        shell: pwsh
        run: |
          $v = "${{ env.VERSION }}" -replace '^v', ''
          (Get-Content pubspec.yaml) | ForEach-Object {
            if ($_ -match '^version:') { "version: $v" } else { $_ }
          } | Set-Content pubspec.yaml -Encoding utf8
          Get-Content pubspec.yaml | Select-Object -First 6

      - name: Run Tests (校验注入版本号)
        run: flutter test --dart-define=APP_VERSION=${{ env.VERSION }}

      - name: Build Windows Release
        run: flutter build windows --release --dart-define="APP_VERSION=${{ env.VERSION }}"

      - name: Compress Release Folder
        shell: pwsh
        run: |
          if (!(Test-Path -Path "dist")) {
            New-Item -ItemType Directory -Path "dist"
          }

          $ZipFileName = "${{ env.APP_NAME }}-${{ env.VERSION }}-Windows.zip"

          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/$ZipFileName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ env.APP_NAME }} ${{ env.VERSION }}"
          files: "dist/*.zip"
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}